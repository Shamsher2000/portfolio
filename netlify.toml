# Netlify Configuration for Frontend-Only Portfolio Website

[build]
  # Install client dependencies and build the React app
  command = "npm install --prefix client && npm run build --prefix client"

  # Directory to deploy (built React app)
  publish = "client/dist"

  # Environment settings
[build.environment]
  NODE_VERSION = "20.19.0"
  SECRETS_SCAN_OMIT_KEYS = "PORT"

# Redirect all non-file requests to index.html for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache rules
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
