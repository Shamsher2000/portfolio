# Netlify Configuration for Portfolio Website

[build]
  # Build command - changed to work better with Netlify
  command = "cd client && npm install && npm run build"

  # Directory to deploy
  publish = "client/dist"

  # Directory for serverless functions (optional)
  functions = "netlify/functions"

  # Environment settings
  environment = { NODE_VERSION = "20.19.0" }

# Redirect all non-file requests to index.html for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# API redirects to backend (update BACKEND_URL with your deployed server)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Cache rules
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Context-specific settings
[context.production]
  command = "cd client && npm install && npm run build"
  publish = "client/dist"
  environment = { NODE_VERSION = "20.19.0" }

[context.preview]
  command = "cd client && npm install && npm run build"
  publish = "client/dist"
  environment = { NODE_VERSION = "20.19.0" }

[context.develop]
  command = "cd client && npm install && npm run dev"
  publish = "client/dist"
  environment = { NODE_VERSION = "20.19.0" }
